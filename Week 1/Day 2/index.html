<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
    <style>
        body {
            margin: 30px;
            background-color: rgb(185, 152, 109);
        }

        h1 {
            text-align: center;

        }

        h1:hover {
            background-color: rgb(231, 229, 141);
        }

        form {
            max-width: 400px;
            padding: 15px;
            border: 3px solid #1b1919;
            border-radius: 5px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        button {
            background-color: green;
            color: rgb(254, 242, 242);
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>Form to Fill</h1>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="your full name" required>
        <br>
        <label for="email">Email Id:</label>
        <input type="text" id="email" placeholder="your email id" required>
        <br>
        <label for="password">Password:</label>
        <input type="text" id="ps" placeholder="enter your Password" required>
        <br>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male" style="display:inline;">male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female" style="display:inline;">female</label>
        <br>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms" style="display:inline;">I agree to the terms and conditions</label>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
