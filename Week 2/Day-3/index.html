<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Toggle Switch</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    transition:0.3s;
}

body.light{
    background:#ffffff;
    color:#111;
}

body.dark{
    background:#111827;
    color:#fff;
}

.container{
    text-align:center;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.switch{
    position:relative;
    display:inline-block;
    width:60px;
    height:30px;
    margin:20px 0;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#ccc;
    border-radius:30px;
    transition:0.3s;
}

.slider:before{
    position:absolute;
    content:"";
    height:24px;
    width:24px;
    left:3px;
    bottom:3px;
    background:white;
    border-radius:50%;
    transition:0.3s;
}

input:checked + .slider{
    background:#4f46e5;
}

input:checked + .slider:before{
    transform:translateX(30px);
}

.icon{
    font-size:40px;
}

.status{
    margin-top:10px;
    font-weight:bold;
}
</style>

</head>
<body class="light">

<div class="container">
    <h1>Theme Toggle</h1>

    <div class="icon" id="icon">☀️</div>

    <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
    </label>

    <p class="status" id="status">Light Mode</p>
</div>

<script>
const toggle = document.getElementById("toggle");
const body = document.body;
const statusText = document.getElementById("status");
const icon = document.getElementById("icon");

let savedTheme = localStorage.getItem("theme");

if(savedTheme){
    body.className = savedTheme;
    toggle.checked = savedTheme === "dark";
    updateUI(savedTheme);
}

toggle.addEventListener("change", () => {
    if(toggle.checked){
        body.className = "dark";
        localStorage.setItem("theme","dark");
        updateUI("dark");
    } else {
        body.className = "light";
        localStorage.setItem("theme","light");
        updateUI("light");
    }
});

function updateUI(theme){
    if(theme === "dark"){
        statusText.innerText = "Dark Mode";
        icon.innerText = "🌙";
    } else {
        statusText.innerText = "Light Mode";
        icon.innerText = "☀️";
    }
}

</script>

</body>
</html>
