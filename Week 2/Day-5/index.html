<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Quiz App</title>

<style>

    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#212225,#654883);
}

.quiz-container{
    background:#fff;
    padding:30px;
    border-radius:15px;
    width:400px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

.option{
    display:block;
    padding:10px;
    margin:10px 0;
    background:#f1f1f1;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.option:hover{
    background:#514a4a;
}

.option.correct{
    background:#22c55e;
    color:white;
}

.option.wrong{
    background:#ef4444;
    color:white;
}

button{
    margin-top:20px;
    padding:10px;
    width:100%;
    border:none;
    background: linear-gradient(rgb(58, 32, 62), rgb(77, 77, 92));
    color:#fff;
    border-radius:8px;
    cursor:pointer;
}

.score{
    text-align:center;
    font-size:20px;
}

</style>

</head>
<body>

<div class="quiz-container">
    <div class="progress" id="progress"></div>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <button id="nextBtn">Next</button>
</div>

<script>

const fetchQuestions = () => {
    return new Promise(resolve => {
        setTimeout(() => {
            resolve([
                {
                    question: "What is JavaScript?",
                    options: ["Language", "Framework", "Library", "Tool"],
                    answer: "Language"
                },
                {
                    question: "Which keyword declares variable?",
                    options: ["var", "let", "const", "All"],
                    answer: "All"
                },
                {
                    question: "Which is ES6 feature?",
                    options: ["Arrow Function", "var", "function", "loop"],
                    answer: "Arrow Function"
                }
            ]);
           }, 500);
              });
              };

let questions = [];
let currentIndex = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");

const init = async () => {
    questions = await fetchQuestions();
    renderQuestion();
};
const renderQuestion = () => {
    const { question, options } = questions[currentIndex];

    questionEl.textContent = question;

    optionsEl.innerHTML = options.map(opt => 
        `<div class="option">${opt}</div>`
    ).join("");

    document.querySelectorAll(".option").forEach(option => {
        option.addEventListener("click", selectAnswer);
    });
};
const selectAnswer = (e) => {
    const selected = e.target.textContent;
    const correct = questions[currentIndex].answer;

    document.querySelectorAll(".option").forEach(opt => {
        opt.style.pointerEvents = "none";

        if(opt.textContent === correct){
            opt.classList.add("correct");
        }

        if(opt.textContent === selected && selected !== correct){
            opt.classList.add("wrong");
        }
    });

    if(selected === correct) score++;
};
nextBtn.addEventListener("click", () => {
    currentIndex++;

    if(currentIndex < questions.length){
        renderQuestion();
    } else {
        showScore();
    }
});

const showScore = () => {
    document.querySelector(".quiz-container").innerHTML = `
        <div class="score">
            🎉 Your Score: ${score} / ${questions.length}
        </div>
    `;
};

init();


</script>


</body>
</html>
